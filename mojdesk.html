<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MójDesk" />
<title>MójDesk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #efefed;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9b9b96;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 12px;
    --radius-sm: 8px;
    --red: #E24B4A;
    --red-bg: #FCEBEB;
    --red-text: #A32D2D;
    --amber: #EF9F27;
    --amber-bg: #FAEEDA;
    --amber-text: #633806;
    --blue: #378ADD;
    --blue-bg: #E6F1FB;
    --blue-text: #185FA5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #2a2a28;
      --bg3: #323230;
      --text: #f0f0ec;
      --text2: #a0a09a;
      --text3: #6a6a65;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --red-bg: #3a1515;
      --red-text: #f09595;
      --amber-bg: #2e2010;
      --amber-text: #FAC775;
      --blue-bg: #0c2a45;
      --blue-text: #85B7EB;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }

  /* PORTRAIT */
  .app { max-width: 430px; margin: 0 auto; padding: 0 16px; }

  .header {
    padding: 56px 0 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 0.5px solid var(--border);
    margin: 0 -16px;
    padding-left: 16px;
    padding-right: 16px;
  }
  .greeting { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .dateline { font-size: 13px; color: var(--text2); margin-top: 2px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 0 12px; }
  .stat { background: var(--bg2); border-radius: var(--radius-sm); padding: 14px; position: relative; }
  .stat-num { font-size: 28px; font-weight: 600; letter-spacing: -1px; }
  .stat-num.red { color: var(--red); }
  .stat-label { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .sort-btn {
    position: absolute; top: 10px; right: 10px;
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 16px; padding: 4px;
    border-radius: 6px;
  }
  .sort-btn:active { background: var(--bg3); }

  .add-area { padding-bottom: 12px; }

  .voice-btn {
    width: 100%;
    padding: 16px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 15px;
    color: var(--text2);
    font-family: inherit;
    transition: background 0.1s;
  }
  .voice-btn:active { background: var(--bg2); }
  .voice-btn.listening {
    border-color: var(--red);
    color: var(--red-text);
    background: var(--red-bg);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.7 } }
  .voice-btn i { font-size: 22px; }

  .transcript {
    display: none;
    background: var(--bg2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13px;
    color: var(--text2);
    min-height: 36px;
    font-style: italic;
  }
  .transcript.show { display: block; }

  .manual-row { display: flex; gap: 8px; margin-top: 8px; }
  .manual-input {
    flex: 1;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    -webkit-appearance: none;
  }
  .manual-input:focus { outline: none; border-color: var(--text3); }
  .manual-input::placeholder { color: var(--text3); }
  .add-btn {
    padding: 12px 16px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    background: var(--bg);
    cursor: pointer;
    font-size: 22px;
    color: var(--text);
    line-height: 1;
    font-family: inherit;
  }
  .add-btn:active { background: var(--bg2); }

  .filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 0 12px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    padding: 7px 16px;
    border: 0.5px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: inherit;
    transition: background 0.1s;
  }
  .filter-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .tasks { display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px; }

  .task {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    border-left-width: 3px;
  }
  .task.urgent { border-left-color: var(--red); }
  .task.soon { border-left-color: var(--amber); }
  .task.later { border-left-color: var(--border); }
  .task.inprogress { border-left-color: var(--blue); }
  .task.done-task { opacity: 0.4; }

  .task-row { display: flex; align-items: flex-start; gap: 10px; }

  .check {
    width: 22px; height: 22px;
    border: 1.5px solid var(--border2);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: background 0.1s, border-color 0.1s;
  }
  .check.done { background: var(--text); border-color: var(--text); }
  .check.done::after { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--bg); border-bottom: 2px solid var(--bg); transform: rotate(45deg) translate(-1px,-1px); display: block; }

  .inprogress-btn {
    width: 22px; height: 22px;
    border: 1.5px solid var(--border2);
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: background 0.1s, border-color 0.1s;
    font-size: 12px;
    color: var(--text3);
  }
  .inprogress-btn.active {
    background: var(--blue-bg);
    border-color: var(--blue);
    color: var(--blue-text);
  }
  .inprogress-btn.active::after { content: '⏳'; font-size: 11px; }

  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 15px; line-height: 1.45; color: var(--text); }
  .task-text.struck { text-decoration: line-through; color: var(--text3); }

  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 500; }
  .badge.urgent { background: var(--red-bg); color: var(--red-text); }
  .badge.soon { background: var(--amber-bg); color: var(--amber-text); }
  .badge.later { background: var(--bg2); color: var(--text2); }
  .badge.inprogress { background: var(--blue-bg); color: var(--blue-text); }
  .meta-chip { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 3px; }
  .meta-chip i { font-size: 13px; }

  .task-btns { display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text3);
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-size: 18px;
  }
  .icon-btn:active { background: var(--bg2); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); }
  .empty i { font-size: 36px; display: block; margin-bottom: 10px; }
  .empty p { font-size: 14px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    padding: 20px 16px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    align-items: flex-end;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border-radius: 20px;
    padding: 20px 20px 24px;
    width: 100%;
    max-width: 430px;
  }
  .modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 0 auto 16px; }
  .modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .modal label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; margin-top: 14px; }
  .modal label:first-of-type { margin-top: 0; }
  .modal input[type=text],
  .modal input[type=datetime-local],
  .modal select {
    width: 100%;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 15px;
    background: var(--bg2);
    color: var(--text);
    font-family: inherit;
    -webkit-appearance: none;
  }
  .modal input:focus, .modal select:focus { outline: none; border-color: var(--text3); }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btns button {
    flex: 1; padding: 14px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border2);
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    background: var(--bg2);
    color: var(--text);
    font-weight: 500;
  }
  .modal-btns button.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  .modal-btns button:active { opacity: 0.8; }

  /* LANDSCAPE layout */
  @media (orientation: landscape) {
    body { overflow: hidden; height: 100vh; }
    .app {
      max-width: 100%;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 100vh;
      padding: 0;
      gap: 0;
    }
    .left-col {
      padding: 24px 16px 16px;
      border-right: 0.5px solid var(--border);
      overflow-y: auto;
      height: 100vh;
    }
    .right-col {
      padding: 16px;
      overflow-y: auto;
      height: 100vh;
    }
    .header {
      position: static;
      padding: 0 0 12px;
      margin: 0;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 12px;
    }
    .stats { grid-template-columns: 1fr 1fr; padding: 0 0 12px; }
    .add-area { padding-bottom: 8px; }
    .filters { padding: 4px 0 8px; }
    .tasks { padding-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- PORTRAIT: single column. LANDSCAPE: split via JS -->
  <div class="left-col" id="leftCol">
    <div class="header">
      <div class="greeting" id="greeting">Dzień dobry, Maciej</div>
      <div class="dateline" id="dateline"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num red" id="cUrgent">0</div>
        <div class="stat-label">Pilne dziś</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="cTotal">0</div>
        <div class="stat-label">Aktywnych spraw</div>
        <button class="sort-btn" onclick="toggleSort()" id="sortBtn" title="Sortowanie" aria-label="Zmień sortowanie">
          <i class="ti ti-arrows-sort"></i>
        </button>
      </div>
    </div>

    <div class="add-area">
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
        <i class="ti ti-microphone"></i>
        <span id="voiceLabel">Powiedz co masz do zrobienia</span>
      </button>
      <div class="transcript" id="transcript"></div>
      <div class="manual-row">
        <input class="manual-input" id="manualInput" type="text" placeholder="lub wpisz sprawę..." />
        <button class="add-btn" onclick="addManual()" aria-label="Dodaj"><i class="ti ti-plus"></i></button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Wszystkie</button>
      <button class="filter-btn" onclick="setFilter('urgent',this)">🔴 Pilne</button>
      <button class="filter-btn" onclick="setFilter('soon',this)">🟡 Ten tydzień</button>
      <button class="filter-btn" onclick="setFilter('inprogress',this)">⏳ W toku</button>
      <button class="filter-btn" onclick="setFilter('later',this)">Może poczekać</button>
      <button class="filter-btn" onclick="setFilter('done',this)">✓ Zrobione</button>
    </div>
  </div>

  <div class="right-col" id="rightCol">
    <div class="tasks" id="tasksList"></div>
  </div>

</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modalTitle">Nowa sprawa</h3>
    <label>Treść sprawy</label>
    <input type="text" id="mText" placeholder="np. Przygotować wycenę dla Kowalski" />
    <label>Priorytet</label>
    <select id="mPriority">
      <option value="urgent">🔴 Pilne — dziś</option>
      <option value="soon" selected>🟡 Wkrótce — ten tydzień</option>
      <option value="later">⚪ Może poczekać</option>
    </select>
    <label>Przypomnienie (opcjonalnie)</label>
    <input type="datetime-local" id="mReminder" />
    <label>Kontakt (opcjonalnie)</label>
    <input type="text" id="mContact" placeholder="np. Kowalski, Kasia, indoors.bg" />
    <div class="modal-btns">
      <button onclick="closeModal()">Anuluj</button>
      <button class="primary" onclick="saveModal()">Zapisz</button>
    </div>
  </div>
</div>

<script>
var tasks = JSON.parse(localStorage.getItem('md_tasks') || '[]');
var filter = 'all';
var sortOrder = 'newest';
var editId = null;
var rec = null;
var listening = false;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function save() { localStorage.setItem('md_tasks', JSON.stringify(tasks)); }

function setHeader() {
  var h = new Date().getHours();
  var g = h < 12 ? 'Dzień dobry' : h < 18 ? 'Dzień dobry' : 'Dobry wieczór';
  document.getElementById('greeting').textContent = g + ', Maciej';
  var d = new Date();
  var dni = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
  var mies = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
  document.getElementById('dateline').textContent = dni[d.getDay()] + ', ' + d.getDate() + ' ' + mies[d.getMonth()] + ' ' + d.getFullYear();
}

function counts() {
  var act = tasks.filter(function(t){ return !t.done && !t.inprogress; });
  document.getElementById('cUrgent').textContent = act.filter(function(t){ return t.priority==='urgent'; }).length;
  document.getElementById('cTotal').textContent = tasks.filter(function(t){ return !t.done; }).length;
}

function fmtDate(r) {
  if (!r) return '';
  var d = new Date(r);
  var dni = ['nd','pn','wt','śr','czw','pt','sb'];
  return dni[d.getDay()] + ' ' + d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
}

function badgeHTML(t) {
  if (t.inprogress) return '<span class="badge inprogress">W toku</span>';
  if (t.priority==='urgent') return '<span class="badge urgent">Pilne</span>';
  if (t.priority==='soon') return '<span class="badge soon">Ten tydzień</span>';
  return '<span class="badge later">Może poczekać</span>';
}

function toggleSort() {
  sortOrder = sortOrder === 'newest' ? 'oldest' : 'newest';
  var btn = document.getElementById('sortBtn');
  btn.title = sortOrder === 'newest' ? 'Najnowsze pierwsze' : 'Najstarsze pierwsze';
  render();
}

function render() {
  counts();
  var list = document.getElementById('tasksList');
  var vis;
  if (filter==='done') vis = tasks.filter(function(t){ return t.done; });
  else if (filter==='inprogress') vis = tasks.filter(function(t){ return !t.done && t.inprogress; });
  else if (filter==='all') vis = tasks.filter(function(t){ return !t.done && !t.inprogress; });
  else vis = tasks.filter(function(t){ return !t.done && !t.inprogress && t.priority===filter; });

  var sorted = vis.slice().sort(function(a,b){
    return sortOrder === 'newest' ? b.created - a.created : a.created - b.created;
  });

  if (!sorted.length) {
    list.innerHTML = '<div class="empty"><i class="ti ti-checklist"></i><p>Brak spraw w tej kategorii</p></div>';
    return;
  }

  list.innerHTML = sorted.map(function(t) {
    var borderClass = t.inprogress ? 'inprogress' : t.priority;
    return '<div class="task ' + borderClass + (t.done?' done-task':'') + '">' +
      '<div class="task-row">' +
        '<div class="check ' + (t.done?'done':'') + '" onclick="toggleDone(\'' + t.id + '\')" title="Zamknij sprawę" aria-label="Oznacz jako zrobione"></div>' +
        '<div class="inprogress-btn ' + (t.inprogress?'active':'') + '" onclick="toggleInprogress(\'' + t.id + '\')" title="W toku — czekam na reakcję" aria-label="W toku"></div>' +
        '<div class="task-body">' +
          '<div class="task-text' + (t.done?' struck':'') + '">' + esc(t.text) + '</div>' +
          '<div class="task-meta">' +
            badgeHTML(t) +
            (t.contact ? '<span class="meta-chip"><i class="ti ti-user"></i>' + esc(t.contact) + '</span>' : '') +
            (t.reminder ? '<span class="meta-chip"><i class="ti ti-bell"></i>' + fmtDate(t.reminder) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="task-btns">' +
          '<button class="icon-btn" onclick="openEdit(\'' + t.id + '\')" aria-label="Edytuj"><i class="ti ti-edit"></i></button>' +
          '<button class="icon-btn" onclick="del(\'' + t.id + '\')" aria-label="Usuń"><i class="ti ti-trash"></i></button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function toggleDone(id) {
  var t = tasks.find(function(t){ return t.id===id; });
  if (t) { t.done = !t.done; t.inprogress = false; save(); render(); }
}

function toggleInprogress(id) {
  var t = tasks.find(function(t){ return t.id===id; });
  if (t) { t.inprogress = !t.inprogress; save(); render(); }
}

function del(id) {
  if (!confirm('Usunąć tę sprawę?')) return;
  tasks = tasks.filter(function(t){ return t.id!==id; });
  save(); render();
}

function openAdd(text) {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Nowa sprawa';
  document.getElementById('mText').value = text || '';
  document.getElementById('mPriority').value = 'soon';
  document.getElementById('mReminder').value = '';
  document.getElementById('mContact').value = '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(function(){ document.getElementById('mText').focus(); }, 300);
}

function openEdit(id) {
  var t = tasks.find(function(t){ return t.id===id; });
  if (!t) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Edytuj sprawę';
  document.getElementById('mText').value = t.text;
  document.getElementById('mPriority').value = t.priority;
  document.getElementById('mReminder').value = t.reminder || '';
  document.getElementById('mContact').value = t.contact || '';
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editId = null;
}

function saveModal() {
  var text = document.getElementById('mText').value.trim();
  if (!text) return;
  var priority = document.getElementById('mPriority').value;
  var reminder = document.getElementById('mReminder').value;
  var contact = document.getElementById('mContact').value.trim();
  if (editId) {
    var t = tasks.find(function(t){ return t.id===editId; });
    if (t) { t.text=text; t.priority=priority; t.reminder=reminder; t.contact=contact; }
  } else {
    tasks.unshift({ id:uid(), text:text, priority:priority, reminder:reminder, contact:contact, done:false, inprogress:false, created:Date.now() });
  }
  if (reminder) scheduleNotif(text, reminder);
  save(); closeModal(); render();
}

function addManual() {
  var v = document.getElementById('manualInput').value.trim();
  if (!v) return;
  document.getElementById('manualInput').value = '';
  openAdd(v);
}

document.getElementById('manualInput').addEventListener('keydown', function(e){
  if (e.key==='Enter') addManual();
});

document.getElementById('overlay').addEventListener('click', function(e){
  if (e.target===this) closeModal();
});

function scheduleNotif(text, reminderStr) {
  if (!('Notification' in window)) return;
  var ms = new Date(reminderStr).getTime() - Date.now();
  if (ms <= 0) return;
  Notification.requestPermission().then(function(p){
    if (p==='granted') {
      setTimeout(function(){ new Notification('MójDesk', { body: text }); }, ms);
    }
  });
}

function toggleVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Rozpoznawanie głosu działa w Safari 15+ na iPhonie.');
    return;
  }
  if (listening) { rec && rec.stop(); return; }

  rec = new SR();
  rec.lang = 'pl-PL';
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  var btn = document.getElementById('voiceBtn');
  var label = document.getElementById('voiceLabel');
  var tr = document.getElementById('transcript');

  rec.onstart = function() {
    listening = true;
    btn.classList.add('listening');
    label.textContent = 'Słucham... dotknij by zakończyć';
    tr.textContent = '...';
    tr.classList.add('show');
  };
  rec.onresult = function(e) {
    var t = Array.from(e.results).map(function(r){ return r[0].transcript; }).join('');
    tr.textContent = t;
  };
  rec.onend = function() {
    listening = false;
    btn.classList.remove('listening');
    label.textContent = 'Powiedz co masz do zrobienia';
    var t = tr.textContent;
    tr.classList.remove('show');
    if (t && t !== '...') openAdd(t);
  };
  rec.onerror = function() {
    listening = false;
    btn.classList.remove('listening');
    label.textContent = 'Powiedz co masz do zrobienia';
    tr.classList.remove('show');
  };
  rec.start();
}

/* Landscape: move tasks list to right column */
function applyLayout() {
  var landscape = window.innerWidth > window.innerHeight;
  var app = document.getElementById('app');
  var leftCol = document.getElementById('leftCol');
  var rightCol = document.getElementById('rightCol');
  var tasksList = document.getElementById('tasksList');

  if (landscape) {
    app.style.display = 'grid';
    app.style.gridTemplateColumns = '300px 1fr';
    app.style.maxWidth = '100%';
    leftCol.style.overflowY = 'auto';
    leftCol.style.height = '100vh';
    rightCol.style.overflowY = 'auto';
    rightCol.style.height = '100vh';
    if (!rightCol.contains(tasksList)) rightCol.appendChild(tasksList);
  } else {
    app.style.display = '';
    app.style.gridTemplateColumns = '';
    app.style.maxWidth = '';
    leftCol.style.overflowY = '';
    leftCol.style.height = '';
    rightCol.style.overflowY = '';
    rightCol.style.height = '';
    if (!leftCol.contains(tasksList)) leftCol.appendChild(tasksList);
  }
}

window.addEventListener('orientationchange', function(){ setTimeout(applyLayout, 150); });
window.addEventListener('resize', applyLayout);

setHeader();
applyLayout();
render();
</script>
